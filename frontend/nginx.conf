server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Fix M1: HTTP Security Headers
    # -------------------------------------------------------------------------

    # Prevent MIME-type sniffing (e.g. serving a .txt as JS)
    add_header X-Content-Type-Options        "nosniff"                              always;

    # Block rendering inside iframes to prevent clickjacking
    add_header X-Frame-Options               "DENY"                                 always;

    # Legacy XSS filter hint for older browsers
    add_header X-XSS-Protection             "1; mode=block"                        always;

    # Prevent upstream URL leakage to third-party CDNs (e.g. Google Fonts)
    add_header Referrer-Policy              "strict-origin-when-cross-origin"      always;

    # Restrict access to sensitive browser APIs not used by this app
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy — scoped to the sources actually used by this SPA:
    #   - Scripts: self only (Vite builds inline JS into /assets/)
    #   - Styles: self + Google Fonts CSS
    #   - Fonts: self + Google Fonts static files
    #   - Connect: self + backend API (update YOUR_BACKEND_URL to your Render service URL)
    #   - Images: self + data URIs (canvas-confetti uses data: blobs)
    #   - Frame ancestors: deny (belt-and-suspenders with X-Frame-Options)
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.onrender.com; img-src 'self' data: blob:; worker-src blob:; frame-ancestors 'none';" always;

    # HSTS — Uncomment ONLY if TLS terminates at this nginx instance (not at Netlify CDN or upstream LB)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA routing - forward all paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

